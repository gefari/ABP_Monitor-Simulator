[package]
name = "abp-simulator"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
embassy-stm32 = { version = "0.6.0", features = ["defmt", "stm32f746ng", "memory-x", "time-driver-any", "exti", "unstable-pac"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-futures = "0.1.2"
embedded-graphics = "0.8.2"
libm = "0.2"
stm32-fmc = "0.4.0" # SDRAM chip definitions (IS42S32800G); same version embassy-stm32 uses

cortex-m = { version = "0.7.10", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.7"

defmt = "1.2.0"
defmt-rtt = "1.3.1"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
embassy-net = { version = "0.9.1", features = ["defmt", "proto-ipv4", "medium-ethernet", "tcp", "udp", "auto-icmp-echo-reply"] }
static_cell = "2.1.1"

[features]
# Run the full 32 MiB SDRAM memory test at boot (~3.5 s).
sdram-test = []

[profile.dev]
opt-level = "s"
debug = 2

[profile.release]
debug = 2
lto = "fat"
codegen-units = 1
opt-level = "s"
